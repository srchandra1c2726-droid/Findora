<script>

const SEARCH_KEY = "khojio_search_history";
const DOWNLOAD_KEY = "khojio_download_history";
const DARK_KEY = "khojio_dark_mode";


function getData(key){

try{
return JSON.parse(localStorage.getItem(key)) || [];
}
catch{
return [];
}

}


function saveData(key,data){

localStorage.setItem(
key,
JSON.stringify(data)
);

}



/* SEARCH HISTORY */

function addSearchHistory(text){

let data = getData(SEARCH_KEY);


data.unshift({

text:text,

time:new Date().toLocaleString("hi-IN")

});


data=data.slice(0,100);


saveData(
SEARCH_KEY,
data
);


}



function clearSearchHistory(){

localStorage.removeItem(
SEARCH_KEY
);

alert("Search history clear ho gayi");

}




/* DOWNLOAD HISTORY */


function addDownloadHistory(file){

let data=getData(DOWNLOAD_KEY);


data.unshift({

text:file,

time:new Date().toLocaleString("hi-IN")

});


saveData(
DOWNLOAD_KEY,
data
);


}



function clearDownloadHistory(){

localStorage.removeItem(
DOWNLOAD_KEY
);

alert("Download history clear ho gayi");

}




/* CLEAR EVERYTHING */


function clearEverything(){

localStorage.clear();

alert(
"KHOJIO ka sara saved data clear ho gaya"
);

}




/* DARK MODE */


function setDarkMode(){

document.body.classList.toggle(
"dark"
);


if(
document.body.classList.contains("dark")
){

localStorage.setItem(
DARK_KEY,
"true"
);

}
else{

localStorage.removeItem(
DARK_KEY
);

}

}



if(
localStorage.getItem(DARK_KEY)
){

document.body.classList.add("dark");

}



/* SEARCH BUTTON */


const input =
document.querySelector(".search-box input");


const searchButton =
document.querySelector(".search-main");



searchButton.onclick=function(){

let text=input.value.trim();


if(!text){
return;
}


addSearchHistory(text);



window.location.href =
"https://www.google.com/search?q="
+
encodeURIComponent(text);


};



/* ENTER SEARCH */


input.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

searchButton.click();

}

});



</script>

  <script>

/* =========================
   VOICE SEARCH
========================= */


const micButton =
document.querySelector(".btn:nth-of-type(1)");


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(SpeechRecognition){


const recognition =
new SpeechRecognition();


recognition.lang="hi-IN";


recognition.continuous=false;


micButton.onclick=function(){

recognition.start();

micButton.innerHTML="🔴";

};



recognition.onresult=function(event){

let text =
event.results[0][0].transcript;


input.value=text;


addSearchHistory(text);


micButton.innerHTML="🎙️";


};



recognition.onend=function(){

micButton.innerHTML="🎙️";

};



}
