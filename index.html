<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Khojoi.in - Fast Search Engine</title>
  <meta name="description" content="Khojoi.in - Fast, simple and smart search engine with voice, image and AI search.">
  <meta name="robots" content="index, follow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1769e8;
      --text: #202124;
      --gray: #70757a;
      --border: #dfe1e5;
      --light: #f1f3f4;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* LOGO */

    .logo-area {
      text-align: center;
      padding-top: 28px;
      padding-bottom: 38px;
    }

    .logo {
      font-size: 52px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;
    }

    .logo .k {
      color: var(--blue);
    }

    .logo .rest {
      color: #202124;
    }

    /* SEARCH */

    .search-container {
      width: min(820px, 92%);
      margin: auto;
    }

    .search-box {
      width: 100%;
      height: 56px;
      border: 1px solid var(--border);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 0 12px 0 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      background: #fff;
      transition: .2s;
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,.14);
    }

    .search-icon {
      font-size: 23px;
      color: #777;
      margin-right: 9px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      font-size: 16px;
      color: var(--text);
    }

    #searchInput::placeholder {
      color: #777;
    }

    .search-tools {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .tool-btn {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-btn:hover {
      background: var(--light);
    }

    .ai-btn {
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 7px;
      border-radius: 8px;
    }

    .ai-btn:hover {
      background: var(--light);
    }

    .spark {
      color: #7546ed;
      font-size: 19px;
    }

    /* TABS */

    .tabs {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 25px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--gray);
      font-size: 15px;
      padding: 7px 3px 12px;
      cursor: pointer;
      position: relative;
    }

    .tab.active {
      color: var(--blue);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--blue);
      border-radius: 2px;
    }

    /* SHORTCUTS */

    .shortcuts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 42px;
      margin-top: 42px;
    }

    .shortcut {
      width: 78px;
      text-align: center;
      cursor: pointer;
    }

    .shortcut-icon {
      width: 62px;
      height: 62px;
      margin: auto;
      border-radius: 50%;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: .2s;
    }

    .shortcut:hover .shortcut-icon {
      transform: translateY(-2px);
      box-shadow: 0 3px 8px rgba(0,0,0,.12);
    }

    .shortcut-name {
      margin-top: 10px;
      font-size: 14px;
      color: #303134;
      white-space: nowrap;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 22px;
      margin-top: auto;
      color: #777;
      font-size: 12px;
    }

    footer a {
      color: #777;
      text-decoration: none;
      margin: 0 8px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    #imageInput {
      display: none;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .logo-area {
        padding-top: 25px;
        padding-bottom: 32px;
      }

      .logo {
        font-size: 43px;
        letter-spacing: -2px;
      }

      .search-container {
        width: 94%;
      }

      .search-box {
        height: 50px;
        padding: 0 8px 0 12px;
      }

      .search-icon {
        font-size: 21px;
        margin-right: 5px;
      }

      #searchInput {
        font-size: 15px;
      }

      .tool-btn {
        width: 33px;
        height: 33px;
        font-size: 18px;
      }

      .ai-btn {
        font-size: 12px;
        padding: 5px;
      }

      .spark {
        font-size: 16px;
      }

      .tabs {
        gap: 19px;
        margin-top: 22px;
        overflow-x: auto;
        justify-content: flex-start;
        padding: 0 12px;
      }

      .tab {
        font-size: 14px;
        white-space: nowrap;
      }

      .shortcuts {
        gap: 25px;
        margin-top: 35px;
      }

      .shortcut {
        width: 68px;
      }

      .shortcut-icon {
        width: 55px;
        height: 55px;
        font-size: 24px;
      }

      .shortcut-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="logo-area">
    <div class="logo">
      <span class="k">K</span><span class="rest">HOJOI</span>
    </div>
  </div>

  <div class="search-container">

    <form class="search-box" id="searchForm">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="Search Khojoi or type a URL"
        autocomplete="off"
        aria-label="Search Khojoi"
      >

      <div class="search-tools">

        <button
          class="tool-btn"
          type="button"
          id="voiceButton"
          title="Voice Search"
          aria-label="Voice Search">
          🎙️
        </button>

        <button
          class="tool-btn"
          type="button"
          id="imageButton"
          title="Image Search"
          aria-label="Image Search">
          📷
        </button>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
        >

        <button
          class="ai-btn"
          type="button"
          id="aiButton">
          <span class="spark">✦</span>
          <span>AI Mode</span>
        </button>

      </div>
    </form>

    <div class="tabs">

      <button class="tab active" data-type="web">
        All
      </button>

      <button class="tab" data-type="images">
        Images
      </button>

      <button class="tab" data-type="videos">
        Videos
      </button>

      <button class="tab" data-type="news">
        News
      </button>

      <button class="tab" data-type="ai">
        AI
      </button>

    </div>

    <div class="shortcuts">

      <div class="shortcut" data-url="https://khojoi.in">
        <div class="shortcut-icon">🔎</div>
        <div class="shortcut-name">KHOJOI</div>
      </div>

      <div class="shortcut" data-url="https://www.youtube.com">
        <div class="shortcut-icon">▶️</div>
        <div class="shortcut-name">YouTube</div>
      </div>

      <div class="shortcut" data-url="https://github.com">
        <div class="shortcut-icon">◉</div>
        <div class="shortcut-name">GitHub</div>
      </div>

      <div class="shortcut" data-url="https://news.google.com">
        <div class="shortcut-icon">📰</div>
        <div class="shortcut-name">News</div>
      </div>

      <div class="shortcut" id="addShortcut">
        <div class="shortcut-icon">+</div>
        <div class="shortcut-name">Add shortcut</div>
      </div>

    </div>

  </div>

  <footer>
    <a href="https://khojoi.in">Khojoi.in</a>
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
  </footer>

</div>

<script>

  const searchForm = document.getElementById("searchForm");
  const searchInput = document.getElementById("searchInput");
  const voiceButton = document.getElementById("voiceButton");
  const imageButton = document.getElementById("imageButton");
  const imageInput = document.getElementById("imageInput");
  const aiButton = document.getElementById("aiButton");
  const tabs = document.querySelectorAll(".tab");
  const shortcuts = document.querySelectorAll(".shortcut[data-url]");
  const addShortcut = document.getElementById("addShortcut");

  function doSearch(type = "web") {

    const query = searchInput.value.trim();

    if (!query) {
      searchInput.focus();
      return;
    }

    let url;

    if (type === "images") {
      url =
        "https://www.google.com/search?tbm=isch&q=" +
        encodeURIComponent(query);

    } else if (type === "videos") {
      url =
        "https://www.google.com/search?tbm=vid&q=" +
        encodeURIComponent(query);

    } else if (type === "news") {
      url =
        "https://www.google.com/search?tbm=nws&q=" +
        encodeURIComponent(query);

    } else {
      url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);
    }

    window.location.href = url;
  }

  searchForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const activeTab =
      document.querySelector(".tab.active");

    doSearch(
      activeTab
        ? activeTab.dataset.type
        : "web"
    );
  });

  tabs.forEach(tab => {

    tab.addEventListener("click", function() {

      tabs.forEach(t =>
        t.classList.remove("active")
      );

      this.classList.add("active");

      if (this.dataset.type === "ai") {
        aiMode();
      } else {
        searchInput.focus();
      }

    });

  });

  voiceButton.addEventListener("click", function() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert(
        "Voice search is not supported in this browser."
      );
      return;
    }

    const recognition =
      new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.interimResults = false;

    voiceButton.textContent = "🔴";

    recognition.start();

    recognition.onresult = function(event) {

      searchInput.value =
        event.results[0][0].transcript;

      doSearch();

    };

    recognition.onerror = function() {
      voiceButton.textContent = "🎙️";
    };

    recognition.onend = function() {
      voiceButton.textContent = "🎙️";
    };

  });

  imageButton.addEventListener("click", function() {
    imageInput.click();
  });

  imageInput.addEventListener("change", function() {

    if (this.files.length > 0) {

      alert(
        "Image selected: " +
        this.files[0].name +
        "\n\nImage search backend next step mein connect karenge."
      );

    }

  });

  function aiMode() {

    const query =
      searchInput.value.trim();

    if (!query) {
      alert(
        "AI Mode ke liye pehle question type karein."
      );
      searchInput.focus();
      return;
    }

    alert(
      "Khojoi AI Mode\n\n" +
      "AI backend next step mein connect karenge."
    );
  }

  aiButton.addEventListener(
    "click",
    aiMode
  );

  shortcuts.forEach(shortcut => {

    shortcut.addEventListener("click", function() {

      window.open(
        this.dataset.url,
        "_blank"
      );

    });

  });

  addShortcut.addEventListener("click", function() {

    const name =
      prompt("Shortcut ka naam likhiye:");

    if (!name) return;

    const url =
      prompt("Website URL likhiye:");

    if (!url) return;

    window.open(
      url.startsWith("http")
        ? url
        : "https://" + url,
      "_blank"
    );

  });

  document.addEventListener("keydown", function(e) {

    if (
      e.key === "/" &&
      document.activeElement !== searchInput
    ) {

      e.preventDefault();
      searchInput.focus();

    }

  });

</script>

</body>
</html>
