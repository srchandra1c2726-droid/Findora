<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KHOJIO Voice Search</title>
  <meta name="description" content="KHOJIO voice assistant and search engine. Search the web using your voice.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080e1d;
      color: #fff;
      min-height: 100vh;
    }

    .main {
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      margin: auto;
      padding: 25px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 22px;
      align-items: center;
    }

    /* ================= VOICE CARD ================= */

    .voice-card {
      min-height: 620px;
      padding: 38px 30px 28px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% -10%, #263c68 0%, transparent 42%),
        linear-gradient(145deg, #182137, #101725);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #55d7ff;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .voice-card h1 {
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.1;
      margin-bottom: 12px;

      background: linear-gradient(90deg, #ffffff, #69dfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #aab7d0;
      font-size: 15px;
      margin-bottom: 50px;
    }

    /* ================= MIC ================= */

    .mic-area {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .ring {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 2px solid rgba(0, 217, 255, .22);
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 2px solid rgba(91, 88, 255, .30);
    }

    .mic-btn {
      position: relative;
      z-index: 2;
      width: 145px;
      height: 145px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(145deg, #626eff, #00b9ee);
      box-shadow:
        0 0 35px rgba(0, 190, 255, .35),
        inset 0 0 20px rgba(255,255,255,.12);

      transition: .25s ease;
    }

    .mic-btn:hover {
      transform: scale(1.06);
      box-shadow:
        0 0 50px rgba(0, 190, 255, .55),
        inset 0 0 20px rgba(255,255,255,.15);
    }

    .mic-btn:active {
      transform: scale(.96);
    }

    .mic-icon {
      width: 34px;
      height: 52px;
      border: 5px solid #fff;
      border-radius: 20px;
      position: relative;
    }

    .mic-icon::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -20px;
      width: 50px;
      height: 32px;
      border: 5px solid #fff;
      border-top: 0;
      border-radius: 0 0 30px 30px;
      transform: translateX(-50%);
    }

    .mic-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -32px;
      width: 5px;
      height: 13px;
      background: #fff;
      transform: translateX(-50%);
      border-radius: 5px;
    }

    .mic-text {
      color: #72ddff;
      font-size: 15px;
      margin-bottom: 38px;
    }

    /* ================= SPEECH BOX ================= */

    .speech-box {
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-radius: 16px;
      background: rgba(5, 10, 22, .45);
      border: 1px solid rgba(255,255,255,.07);
    }

    .speech-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: #8795b3;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    #result {
      color: #dfe7f7;
      font-size: 15px;
      min-height: 25px;
    }

    /* ================= SEARCH CARD ================= */

    .search-card {
      min-height: 620px;
      padding: 35px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 0%, #162342, transparent 48%),
        #0c1427;

      border: 1px solid rgba(255,255,255,.07);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: min(220px, 70%);
      max-height: 150px;
      object-fit: contain;
      margin-bottom: 35px;
    }

    .search-title {
      font-size: 14px;
      color: #7e8ca9;
      margin-bottom: 15px;
      text-align: center;
    }

    .search-box {
      width: 100%;
      max-width: 480px;
      height: 58px;
      border-radius: 30px;
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    .search-icon {
      font-size: 25px;
      color: #444;
      margin-right: 14px;
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: 0;
      font-size: 15px;
      color: #222;
      background: transparent;
    }

    .search-box button {
      border: 0;
      background: #087ef5;
      color: #fff;
      border-radius: 22px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 600;
    }

    .search-box button:hover {
      background: #0567cf;
    }

    .search-note {
      margin-top: 18px;
      color: #687795;
      font-size: 12px;
      text-align: center;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 850px) {

      .main {
        grid-template-columns: 1fr;
        padding: 15px;
      }

      .voice-card,
      .search-card {
        min-height: auto;
      }

      .voice-card {
        padding: 30px 20px;
      }

      .search-card {
        padding: 35px 20px;
        min-height: 400px;
      }

      .subtitle {
        margin-bottom: 30px;
      }

      .mic-area {
        transform: scale(.88);
        margin-top: -10px;
        margin-bottom: 15px;
      }
    }

    @media (max-width: 480px) {

      .main {
        padding: 10px;
      }

      .voice-card,
      .search-card {
        border-radius: 20px;
      }

      .voice-card h1 {
        font-size: 31px;
      }

      .mic-area {
        transform: scale(.75);
        margin-top: -15px;
        margin-bottom: -5px;
      }

      .search-box {
        height: 52px;
      }

      .search-box button {
        padding: 8px 13px;
      }
    }

    /* ================= LISTENING ================= */

    .listening .mic-btn {
      animation: pulse 1.2s infinite;
    }

    .listening .ring {
      animation: ringPulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes ringPulse {
      0%, 100% {
        transform: scale(1);
        opacity: .5;
      }
      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <main class="main">

    <!-- VOICE ASSISTANT -->
    <section class="voice-card" id="voiceCard">

      <div class="brand">KHOJIO</div>

      <h1>Voice Assistant</h1>

      <p class="subtitle">
        Press the microphone and start speaking
      </p>

      <div class="mic-area">

        <div class="ring"></div>

        <button class="mic-btn" id="micBtn" aria-label="Start voice search">
          <span class="mic-icon"></span>
        </button>

      </div>

      <p class="mic-text" id="micText">
        Click the microphone to start
      </p>

      <div class="speech-box">

        <div class="speech-title">
          Your Voice
        </div>

        <div id="result">
          Your speech will appear here...
        </div>

      </div>

    </section>


    <!-- SEARCH -->
    <section class="search-card">

      <!-- Apna KHOJIO logo yahan lagayein -->
      <img
        class="logo"
        src="logo.png"
        alt="KHOJIO Search Engine Logo"
      >

      <p class="search-title">
        Search, Find & Discover
      </p>

      <form
        class="search-box"
        action="https://www.google.com/search"
        method="get"
        target="_blank"
      >

        <span class="search-icon">⌕</span>

        <input
          type="search"
          name="q"
          placeholder="Search the web..."
          aria-label="Search the web"
          autocomplete="off"
        >

        <button type="submit">
          Search
        </button>

      </form>

      <p class="search-note">
        Search the web quickly with KHOJIO
      </p>

    </section>

  </main>


  <script>
    const micBtn = document.getElementById("micBtn");
    const voiceCard = document.getElementById("voiceCard");
    const result = document.getElementById("result");
    const micText = document.getElementById("micText");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {

      const recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      micBtn.addEventListener("click", () => {

        try {
          recognition.start();

          voiceCard.classList.add("listening");

          micText.textContent = "Listening...";
          result.textContent = "Speak now...";

        } catch (error) {
          console.log(error);
        }

      });

      recognition.onresult = function(event) {

        const text =
          event.results[0][0].transcript;

        result.textContent = text;

        micText.textContent = "Voice captured";

        voiceCard.classList.remove("listening");

        // Voice ko Google search mein bhejna
        const url =
          "https://www.google.com/search?q=" +
          encodeURIComponent(text);

        window.open(url, "_blank");
      };

      recognition.onend = function() {

        voiceCard.classList.remove("listening");

        if (micText.textContent === "Listening...") {
          micText.textContent =
            "Click the microphone to start";
        }

      };

      recognition.onerror = function(event) {

        voiceCard.classList.remove("listening");

        micText.textContent =
          "Microphone error. Please try again.";

        console.log(event.error);
      };

    } else {

      micText.textContent =
        "Voice search is not supported in this browser.";

      micBtn.disabled = true;

    }
  </script>
  <body>
<img src="logo.png" alt="Khojio Logo" width="150">
    <script async src="https://cse.google.com/cse.js?cx=93d75dd86436c4d96">
</script>
<div class="gcse-search"></div>
  </body>
  </html>
