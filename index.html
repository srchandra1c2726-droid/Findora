<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KHOJIO - AI Voice Search</title>
<meta name="description" content="KHOJIO AI voice search engine. Ask questions using voice or text.">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#070c18;
}

.app{
  width:100%;
  max-width:720px;
  padding:28px;
  border-radius:26px;
  background:
    radial-gradient(circle at 50% 0%,#263c69,transparent 45%),
    linear-gradient(145deg,#182137,#0b1220);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}

/* LOGO */

.logo{
  display:block;
  width:150px;
  max-width:60%;
  margin:0 auto 12px;
}

/* TITLE */

h1{
  text-align:center;
  font-size:34px;
  margin-bottom:7px;
  background:linear-gradient(90deg,#fff,#62dcff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  text-align:center;
  color:#9eacc5;
  font-size:14px;
  margin-bottom:24px;
}

/* MIC */

.mic-area{
  width:190px;
  height:190px;
  margin:auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ring{
  position:absolute;
  width:175px;
  height:175px;
  border-radius:50%;
  border:2px solid rgba(0,210,255,.22);
}

.mic{
  width:112px;
  height:112px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  background:linear-gradient(145deg,#6672ff,#00bcec);
  box-shadow:0 0 38px rgba(0,200,255,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

.mic:hover{transform:scale(1.06)}

.mic-symbol{
  width:28px;
  height:45px;
  border:5px solid white;
  border-radius:18px;
  position:relative;
}

.mic-symbol:before{
  content:"";
  position:absolute;
  width:43px;
  height:27px;
  left:50%;
  bottom:-18px;
  transform:translateX(-50%);
  border:5px solid white;
  border-top:0;
  border-radius:0 0 25px 25px;
}

.mic-symbol:after{
  content:"";
  position:absolute;
  width:5px;
  height:12px;
  background:#fff;
  left:50%;
  bottom:-29px;
  transform:translateX(-50%);
}

.status{
  text-align:center;
  color:#65dcff;
  font-size:13px;
  margin:10px 0 20px;
}

/* AI */

.ai-box{
  min-height:100px;
  max-height:300px;
  overflow:auto;
  padding:17px;
  border-radius:16px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:18px;
}

.ai-label{
  color:#65dcff;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:10px;
}

#answer{
  color:#e7edf8;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

/* SEARCH */

.search{
  display:flex;
  height:54px;
  background:#fff;
  border-radius:28px;
  padding:5px;
}

.search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:0 14px;
  font-size:14px;
}

.search button{
  border:0;
  border-radius:23px;
  padding:0 20px;
  background:#087ef5;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.search button:hover{background:#066bd0}

/* ACTIONS */

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action{
  flex:1;
  padding:9px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#aebbd0;
  cursor:pointer;
  font-size:12px;
}

.action:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

/* LOADING */

.loading{
  display:inline-block;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.35}
}

/* LISTENING */

.listening .mic{
  animation:pulse 1s infinite;
}

.listening .ring{
  animation:ring 1s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.08)}
}

@keyframes ring{
  50%{transform:scale(1.1);opacity:1}
}

/* MOBILE */

@media(max-width:500px){

  .app{
    padding:22px 15px;
    border-radius:21px;
  }

  h1{font-size:29px}

  .mic-area{
    transform:scale(.86);
    margin-top:-8px;
    margin-bottom:-8px;
  }

  .search button{
    padding:0 14px;
  }

  .actions{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div class="app">

  <img
    src="logo.png"
    class="logo"
    alt="KHOJIO"
  >

  <h1>AI Voice Assistant</h1>

  <p class="sub">
    Ask anything using your voice or type your question
  </p>

  <!-- MICROPHONE -->

  <div class="mic-area">

    <div class="ring"></div>

    <button
      class="mic"
      id="micBtn"
      aria-label="Start voice search">

      <span class="mic-symbol"></span>

    </button>

  </div>

  <div class="status" id="status">
    Click microphone to speak
  </div>


  <!-- AI ANSWER -->

  <div class="ai-box">

    <div class="ai-label">
      KHOJIO AI
    </div>

    <div id="answer">
      Your AI answer will appear here...
    </div>

  </div>


  <!-- SEARCH -->

  <form
    class="search"
    id="searchForm">

    <input
      id="question"
      type="search"
      placeholder="Ask KHOJIO anything..."
      autocomplete="off"
      required>

    <button type="submit">
      Ask AI
    </button>

  </form>


  <!-- ACTIONS -->

  <div class="actions">

    <button
      class="action"
      onclick="webSearch()">
      🌐 Web Search
    </button>

    <button
      class="action"
      onclick="clearAnswer()">
      Clear
    </button>

  </div>

</div>


<script>

const micBtn =
document.getElementById("micBtn");

const status =
document.getElementById("status");

const answer =
document.getElementById("answer");

const question =
document.getElementById("question");

const app =
document.querySelector(".app");


/* ================= AI ================= */

async function askAI(text){

  if(!text.trim()) return;

  answer.innerHTML =
    '<span class="loading">KHOJIO AI is thinking...</span>';

  try{

    const response =
      await fetch("/api/ask",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          message:text
        })
      });

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "AI request failed"
      );
    }

    answer.textContent =
      data.answer;

  }catch(error){

    answer.textContent =
      "AI connection error. Please try again.";

    console.error(error);

  }
}


/* ================= TEXT ================= */

document
.getElementById("searchForm")
.addEventListener("submit",(e)=>{

  e.preventDefault();

  askAI(question.value);

});


/* ================= VOICE ================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();

  recognition.lang="en-IN";
  recognition.continuous=false;
  recognition.interimResults=false;


  micBtn.onclick=()=>{

    try{

      recognition.start();

      app.classList.add("listening");

      status.textContent =
        "Listening... Speak now";

    }catch(e){

      console.log(e);

    }

  };


  recognition.onresult=(event)=>{

    const text =
      event.results[0][0].transcript;

    question.value=text;

    status.textContent =
      "Voice received";

    app.classList.remove("listening");

    askAI(text);

  };


  recognition.onend=()=>{

    app.classList.remove("listening");

    if(
      status.textContent ===
      "Listening... Speak now"
    ){

      status.textContent =
        "Click microphone to speak";

    }

  };


  recognition.onerror=()=>{

    app.classList.remove("listening");

    status.textContent =
      "Microphone error. Try again.";

  };

}else{

  status.textContent =
    "Voice search is not supported";

  micBtn.disabled=true;

}


/* ================= WEB SEARCH ================= */

function webSearch(){

  const text =
    question.value.trim();

  if(!text) return;

  window.open(
    "https://www.google.com/search?q="+
    encodeURIComponent(text),
    "_blank"
  );

}


/* ================= CLEAR ================= */

function clearAnswer(){

  question.value="";

  answer.textContent =
    "Your AI answer will appear here...";

  status.textContent =
    "Click microphone to speak";

}

</script>
  <body>
<img src="logo.png" alt="Khojio Logo" width="150">
    <script async src="https://cse.google.com/cse.js?cx=93d75dd86436c4d96">
</script>
<div class="gcse-search"></div>
  </body>
  </html>
