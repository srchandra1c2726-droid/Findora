<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Khojio.in - Search Everything</title>

  <meta name="description"
        content="Khojio.in - Fast, simple and smart search engine. Search the web quickly with voice search.">

  <meta name="keywords"
        content="Khojio, Khojio.in, search engine, web search, voice search">

  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://khojio.in/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #202124;
      min-height: 100vh;
    }

    /* ---------- TOP BAR ---------- */

    header {
      width: 100%;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ---------- UNIQUE LOGO ---------- */

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      user-select: none;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #16a085, #00b894);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 5px 15px rgba(0, 184, 148, 0.20);
    }

    /* Search glass inside logo */
    .logo-icon::before {
      content: "";
      width: 14px;
      height: 14px;
      border: 3px solid white;
      border-radius: 50%;
      position: absolute;
      top: 9px;
      left: 9px;
    }

    .logo-icon::after {
      content: "";
      width: 10px;
      height: 3px;
      background: white;
      border-radius: 3px;
      transform: rotate(45deg);
      position: absolute;
      top: 25px;
      left: 23px;
    }

    .logo-text {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.7px;
      color: #202124;
    }

    .logo-text span {
      color: #00a884;
    }

    /* ---------- MAIN ---------- */

    main {
      min-height: calc(100vh - 145px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin-top: -45px;
    }

    .brand-title {
      font-size: clamp(42px, 8vw, 78px);
      font-weight: 800;
      letter-spacing: -4px;
      margin-bottom: 10px;
      color: #202124;
    }

    .brand-title span {
      color: #00a884;
    }

    .tagline {
      font-size: 15px;
      color: #70757a;
      margin-bottom: 28px;
      text-align: center;
    }

    /* ---------- SEARCH ---------- */

    .search-area {
      width: 100%;
      max-width: 650px;
    }

    .search-box {
      width: 100%;
      height: 54px;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 0 14px 0 18px;
      box-shadow: 0 2px 8px rgba(60, 64, 67, 0.08);
      transition: 0.2s ease;
      background: white;
    }

    .search-box:hover,
    .search-box:focus-within {
      box-shadow: 0 3px 14px rgba(60, 64, 67, 0.15);
      border-color: transparent;
    }

    .search-icon {
      font-size: 20px;
      color: #777;
      margin-right: 10px;
    }

    #searchInput {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      font-size: 16px;
      color: #202124;
      background: transparent;
      min-width: 0;
    }

    #searchInput::placeholder {
      color: #8a8a8a;
    }

    /* ---------- MIC ---------- */

    .mic-btn {
      border: none;
      background: transparent;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      margin-right: 3px;
    }

    .mic-btn:hover {
      background: #f1f3f4;
    }

    .mic-btn.listening {
      background: #e8f5f1;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.35);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(0, 168, 132, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(0, 168, 132, 0);
      }
    }

    /* ---------- SEARCH BUTTON ---------- */

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
    }

    .search-btn,
    .lucky-btn {
      border: 1px solid #f1f1f1;
      background: #f8f9fa;
      color: #3c4043;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-btn:hover,
    .lucky-btn:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.15);
    }

    .search-btn {
      background: #00a884;
      color: white;
      border-color: #00a884;
    }

    .search-btn:hover {
      background: #008f70;
      border-color: #008f70;
    }

    /* ---------- INFO ---------- */

    .quick-info {
      margin-top: 30px;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      color: #777;
      font-size: 13px;
    }

    .quick-info span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ---------- FOOTER ---------- */

    footer {
      width: 100%;
      min-height: 55px;
      background: #f8f9fa;
      border-top: 1px solid #eeeeee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 25px;
      color: #70757a;
      font-size: 13px;
    }

    footer a {
      color: #70757a;
      text-decoration: none;
      margin-left: 18px;
    }

    footer a:hover {
      color: #00a884;
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 600px) {

      header {
        padding: 14px 16px;
      }

      .logo-icon {
        width: 35px;
        height: 35px;
        border-radius: 11px;
      }

      .logo-text {
        font-size: 20px;
      }

      main {
        min-height: calc(100vh - 125px);
        margin-top: -30px;
        padding: 15px;
      }

      .brand-title {
        font-size: 52px;
        letter-spacing: -3px;
      }

      .tagline {
        font-size: 14px;
        margin-bottom: 22px;
      }

      .search-box {
        height: 52px;
      }

      .buttons {
        margin-top: 18px;
      }

      .quick-info {
        gap: 12px;
        margin-top: 24px;
      }

      footer {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }

      footer a {
        margin: 0 7px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <a href="/" class="logo" aria-label="Khojio.in Home">

      <div class="logo-icon"></div>

      <div class="logo-text">
        khojio<span>.in</span>
      </div>

    </a>

  </header>


  <!-- MAIN SEARCH -->
  <main>

    <h1 class="brand-title">
      khojio<span>.in</span>
    </h1>

    <p class="tagline">
      Search the web. Find what matters.
    </p>


    <div class="search-area">

      <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="searchInput"
          placeholder="Search Khojio..."
          autocomplete="off"
          aria-label="Search Khojio"
        >

        <button
          class="mic-btn"
          id="micBtn"
          title="Voice Search"
          aria-label="Voice Search">
          🎙️
        </button>

      </div>


      <div class="buttons">

        <button
          class="search-btn"
          onclick="performSearch()">
          Search
        </button>

        <button
          class="lucky-btn"
          onclick="performSearch()">
          Khojio Search
        </button>

      </div>

    </div>


    <div class="quick-info">

      <span>⚡ Fast Search</span>
      <span>🎙️ Voice Search</span>
      <span>📱 Mobile Friendly</span>

    </div>

  </main>


  <!-- FOOTER -->
  <footer>

    <div>
      © 2026 khojio.in
    </div>

    <div>
      <a href="#">About</a>
      <a href="#">Privacy</a>
      <a href="#">Contact</a>
    </div>

  </footer>


  <script>

    const searchInput =
      document.getElementById("searchInput");

    const micBtn =
      document.getElementById("micBtn");


    /* SEARCH */

    function performSearch() {

      const query =
        searchInput.value.trim();

      if (!query) {

        searchInput.focus();

        return;

      }

      /*
       * Yahan apna actual search URL
       * baad mein connect kar sakte ho.
       *
       * Abhi Google search open hoga.
       */

      const url =
        "https://www.google.com/search?q="
        + encodeURIComponent(query);

      window.location.href = url;

    }


    /* ENTER KEY */

    searchInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          performSearch();

        }

      }
    );


    /* VOICE SEARCH */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (SpeechRecognition) {

      const recognition =
        new SpeechRecognition();

      recognition.lang = "hi-IN";

      recognition.continuous = false;

      recognition.interimResults = false;


      micBtn.addEventListener(
        "click",
        function() {

          recognition.start();

          micBtn.classList.add("listening");

          micBtn.innerHTML = "🔴";

        }
      );


      recognition.onresult =
        function(event) {

          const text =
            event.results[0][0].transcript;

          searchInput.value = text;

          micBtn.classList.remove(
            "listening"
          );

          micBtn.innerHTML = "🎙️";

          performSearch();

        };


      recognition.onend =
        function() {

          micBtn.classList.remove(
            "listening"
          );

          micBtn.innerHTML = "🎙️";

        };


      recognition.onerror =
        function() {

          micBtn.classList.remove(
            "listening"
          );

          micBtn.innerHTML = "🎙️";

        };

    } else {

      micBtn.addEventListener(
        "click",
        function() {

          alert(
            "Voice search is not supported in this browser."
          );

        }
      );

    }

  </script>

</body>
</html>
