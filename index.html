<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Search</title>
<meta name="description" content="Fast and simple voice search box.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    font-family:Arial, sans-serif;
}

.search-box{
    width:92%;
    max-width:580px;
    height:52px;
    display:flex;
    align-items:center;
    border:1px solid #dfe1e5;
    border-radius:28px;
    padding:0 10px 0 18px;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.search-box:focus-within{
    box-shadow:0 2px 12px rgba(0,0,0,.18);
}

.search-icon{
    font-size:20px;
    color:#777;
    margin-right:10px;
}

#searchInput{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    font-size:16px;
    color:#222;
    background:transparent;
}

#searchInput::placeholder{
    color:#777;
}

.mic-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:transparent;
    cursor:pointer;
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.mic-btn:hover{
    background:#f1f3f4;
}

.mic-btn.active{
    background:#fee2e2;
    animation:pulse .9s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
    }
}

.search-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f1f3f4;
    cursor:pointer;
    font-size:18px;
}

.search-btn:hover{
    background:#e5e7eb;
}

@media(max-width:500px){
    .search-box{
        height:48px;
    }

    #searchInput{
        font-size:15px;
    }

    .mic-btn,
    .search-btn{
        width:36px;
        height:36px;
    }
}
</style>
</head>

<body>

<form class="search-box" id="searchForm">

    <span class="search-icon">🔍</span>

    <input
        type="search"
        id="searchInput"
        placeholder="Search or speak..."
        aria-label="Search"
        autocomplete="off"
    >

    <button
        type="button"
        class="mic-btn"
        id="micBtn"
        aria-label="Voice search"
        title="Voice Search">
        🎤
    </button>

    <button
        type="submit"
        class="search-btn"
        aria-label="Search">
        ➜
    </button>

</form>

<script>
const input = document.getElementById("searchInput");
const micBtn = document.getElementById("micBtn");
const form = document.getElementById("searchForm");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (SpeechRecognition) {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    micBtn.addEventListener("click", () => {
        recognition.start();
    });

    recognition.onstart = () => {
        micBtn.classList.add("active");
        micBtn.textContent = "🔴";
        input.placeholder = "Listening...";
    };

    recognition.onresult = (event) => {
        input.value =
            event.results[0][0].transcript;
    };

    recognition.onend = () => {
        micBtn.classList.remove("active");
        micBtn.textContent = "🎤";
        input.placeholder = "Search or speak...";
    };

    recognition.onerror = () => {
        micBtn.classList.remove("active");
        micBtn.textContent = "🎤";
        input.placeholder = "Search or speak...";
    };

} else {

    micBtn.style.display = "none";

}

form.addEventListener("submit", function(e){

    e.preventDefault();

    const query = input.value.trim();

    if(query){
        window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(query);
    }

});
</script>
  <body>
<img src="logo.png" alt="Khojio Logo" width="150">
    <script async src="https://cse.google.com/cse.js?cx=93d75dd86436c4d96">
</script>
<div class="gcse-search"></div>
  </body>
  </html>
