<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KHOJIO Voice Search</title>

<meta name="description"
content="KHOJIO voice assistant and search engine.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  font-family:Arial,Helvetica,sans-serif;
  background:#080e1d;
  color:white;
}

/* SINGLE CONTAINER */

.container{
  width:100%;
  max-width:700px;
  padding:32px 28px;
  border-radius:25px;

  background:
  radial-gradient(circle at 50% 0%,#263b68,transparent 45%),
  linear-gradient(145deg,#182137,#0d1424);

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
  0 25px 70px rgba(0,0,0,.45);

  text-align:center;
}

/* LOGO */

.logo{
  width:170px;
  max-width:70%;
  height:auto;
  margin-bottom:18px;
}

/* TITLE */

h1{
  font-size:36px;
  margin-bottom:8px;

  background:linear-gradient(90deg,#fff,#63dfff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  color:#aebbd2;
  font-size:14px;
  margin-bottom:28px;
}

/* MICROPHONE */

.mic-area{
  width:210px;
  height:210px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
}

.ring{
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  border:2px solid rgba(0,200,255,.25);
}

.ring:before{
  content:"";
  position:absolute;
  inset:17px;
  border-radius:50%;
  border:2px solid rgba(95,90,255,.3);
}

.mic-btn{
  width:125px;
  height:125px;

  border:0;
  border-radius:50%;

  cursor:pointer;

  background:linear-gradient(
    145deg,
    #626eff,
    #00b9ee
  );

  box-shadow:
    0 0 35px rgba(0,190,255,.4);

  display:flex;
  align-items:center;
  justify-content:center;

  transition:.25s;
}

.mic-btn:hover{
  transform:scale(1.07);
}

/* MIC ICON */

.mic-icon{
  width:30px;
  height:48px;

  border:5px solid white;
  border-radius:18px;

  position:relative;
}

.mic-icon:before{
  content:"";
  position:absolute;

  width:44px;
  height:28px;

  left:50%;
  bottom:-18px;

  transform:translateX(-50%);

  border:5px solid white;
  border-top:0;

  border-radius:0 0 25px 25px;
}

.mic-icon:after{
  content:"";
  position:absolute;

  width:5px;
  height:12px;

  left:50%;
  bottom:-29px;

  transform:translateX(-50%);

  background:white;
  border-radius:5px;
}

/* MIC TEXT */

.mic-text{
  color:#67dcff;
  font-size:14px;
  margin:18px 0 25px;
}

/* SPEECH */

.speech-box{
  text-align:left;

  padding:16px 18px;

  border-radius:14px;

  background:rgba(0,0,0,.22);

  border:1px solid rgba(255,255,255,.07);

  margin-bottom:22px;
}

.speech-title{
  font-size:10px;
  letter-spacing:2px;
  color:#8290ac;
  text-transform:uppercase;
  margin-bottom:8px;
}

#result{
  color:#e1e8f5;
  font-size:14px;
}

/* SEARCH */

.search-box{
  width:100%;
  height:52px;

  display:flex;
  align-items:center;

  padding:0 8px 0 16px;

  background:white;

  border-radius:28px;

  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.search-icon{
  font-size:24px;
  color:#444;
  margin-right:10px;
}

.search-box input{
  flex:1;

  min-width:0;

  border:0;
  outline:0;

  font-size:14px;
  color:#222;

  background:transparent;
}

.search-box button{
  border:0;

  padding:10px 18px;

  border-radius:22px;

  background:#087ef5;
  color:white;

  font-weight:bold;

  cursor:pointer;
}

.search-box button:hover{
  background:#0567cf;
}

/* LISTENING */

.listening .mic-btn{
  animation:pulse 1s infinite;
}

.listening .ring{
  animation:ring 1s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
  }
}

@keyframes ring{
  50%{
    transform:scale(1.1);
    opacity:1;
  }
}

/* MOBILE */

@media(max-width:500px){

  body{
    padding:10px;
  }

  .container{
    padding:25px 16px;
    border-radius:20px;
  }

  .logo{
    width:145px;
  }

  h1{
    font-size:30px;
  }

  .mic-area{
    transform:scale(.85);
    margin-top:-8px;
    margin-bottom:-8px;
  }

  .search-box button{
    padding:9px 13px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- KHOJIO LOGO -->
  <img
    src="logo.png"
    class="logo"
    alt="KHOJIO Search Engine"
  >

  <!-- VOICE -->
  <h1>Voice Assistant</h1>

  <p class="subtitle">
    Press the microphone and start speaking
  </p>

  <div class="mic-area">

    <div class="ring"></div>

    <button
      class="mic-btn"
      id="micBtn"
      aria-label="Start voice search">

      <span class="mic-icon"></span>

    </button>

  </div>

  <div
    class="mic-text"
    id="micText">

    Click the microphone to start

  </div>

  <!-- VOICE RESULT -->

  <div class="speech-box">

    <div class="speech-title">
      Your Voice
    </div>

    <div id="result">
      Your speech will appear here...
    </div>

  </div>

  <!-- SEARCH -->

  <form
    class="search-box"
    action="https://www.google.com/search"
    method="get"
    target="_blank">

    <span class="search-icon">⌕</span>

    <input
      type="search"
      name="q"
      placeholder="Search the web..."
      autocomplete="off"
      aria-label="Search the web">

    <button type="submit">
      Search
    </button>

  </form>

</div>


<script>

const micBtn =
document.getElementById("micBtn");

const container =
document.querySelector(".container");

const result =
document.getElementById("result");

const micText =
document.getElementById("micText");


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
  new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.continuous=false;

  recognition.interimResults=false;


  micBtn.onclick=()=>{

    try{

      recognition.start();

      container.classList.add("listening");

      micText.textContent="Listening...";

      result.textContent="Speak now...";

    }catch(e){

      console.log(e);

    }

  };


  recognition.onresult=(event)=>{

    const text =
    event.results[0][0].transcript;

    result.textContent=text;

    micText.textContent="Voice captured";

    container.classList.remove("listening");


    /* SEARCH VOICE */

    const url =
    "https://www.google.com/search?q="+
    encodeURIComponent(text);

    window.open(url,"_blank");

  };


  recognition.onend=()=>{

    container.classList.remove("listening");

    if(
      micText.textContent==="Listening..."
    ){

      micText.textContent=
      "Click the microphone to start";

    }

  };


  recognition.onerror=(event)=>{

    container.classList.remove("listening");

    micText.textContent=
    "Please allow microphone access";

    console.log(event.error);

  };

}else{

  micText.textContent=
  "Voice search is not supported";

  micBtn.disabled=true;

}

</script>
  <body>
<img src="logo.png" alt="Khojio Logo" width="150">
    <script async src="https://cse.google.com/cse.js?cx=93d75dd86436c4d96">
</script>
<div class="gcse-search"></div>
  </body>
  </html>
