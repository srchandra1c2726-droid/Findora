<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KHOJOI - Fast Search Engine</title>

  <meta name="description"
        content="Khojoi.in - Fast, simple and smart search engine with voice, image and AI search.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #1769e8;
      --text: #202124;
      --gray: #6b7078;
      --border: #e1e3e6;
      --light: #f1f3f4;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
    }

    /* LOGO */

    .logo-area {
      text-align: center;
      padding-top: 48px;
      padding-bottom: 70px;
    }

    .logo {
      font-size: 78px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -5px;
      user-select: none;
    }

    .logo .k {
      color: #1769e8;
    }

    .logo .rest {
      color: #202124;
    }

    /* SEARCH */

    .search-container {
      width: min(1050px, 94%);
      margin: auto;
    }

    .search-box {
      height: 86px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 45px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.09);
      transition: .2s;
      background: white;
    }

    .search-box:focus-within {
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
    }

    .search-icon {
      font-size: 31px;
      color: #777;
      margin-right: 18px;
    }

    #searchInput {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      font-size: 24px;
      color: var(--text);
      min-width: 0;
    }

    #searchInput::placeholder {
      color: #777;
    }

    .search-tools {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tool-btn {
      border: none;
      background: transparent;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-btn:hover {
      background: var(--light);
    }

    .ai-btn {
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 8px;
      border-radius: 10px;
    }

    .ai-btn:hover {
      background: var(--light);
    }

    .spark {
      color: #7b45ff;
      font-size: 28px;
    }

    /* TABS */

    .tabs {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 40px;
    }

    .tab {
      border: none;
      background: transparent;
      color: #70757a;
      font-size: 20px;
      padding: 8px 4px 16px;
      cursor: pointer;
      position: relative;
    }

    .tab.active {
      color: var(--blue);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: var(--blue);
      border-radius: 3px;
    }

    /* SHORTCUTS */

    .shortcuts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 72px;
      margin-top: 67px;
    }

    .shortcut {
      width: 90px;
      text-align: center;
      cursor: pointer;
    }

    .shortcut-icon {
      width: 84px;
      height: 84px;
      margin: auto;
      border-radius: 50%;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 39px;
      transition: .2s;
    }

    .shortcut:hover .shortcut-icon {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }

    .shortcut-name {
      margin-top: 15px;
      font-size: 19px;
      white-space: nowrap;
      color: #303134;
    }

    /* FOOTER */

    footer {
      text-align: center;
      margin-top: 100px;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }

    footer a {
      color: #777;
      text-decoration: none;
      margin: 0 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* HIDDEN FILE INPUT */

    #imageInput {
      display: none;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .logo-area {
        padding-top: 35px;
        padding-bottom: 45px;
      }

      .logo {

      .search-container {
        width: 94%;
      }

      .search-box {
        height: 64px;
        padding: 0 12px;
      }

      .search-icon {
        font-size: 24px;
        margin-right: 8px;
      }

      #searchInput {
        font-size: 17px;
      }

      .search-tools {
        gap: 3px;
      }

      .tool-btn {
        width: 38px;
        height: 38px;
        font-size: 22px;
      }

      .ai-btn {
        font-size: 14px;
        gap: 4px;
        padding: 7px 4px;
      }

      .spark {

      }

      .tabs {
        gap: 20px;
        margin-top: 28px;
        overflow-x: auto;

        padding: 0 15px;
      }

      .tab {

      }

      .shortcuts {

        margin-top: 45px;
      }

      .shortcut {
        width: 75px;
      }

      .shortcut-icon {
        width: 68px;
        height: 68px;

      }

      .shortcut-name {
        font-size: 15px;
      }

      footer {
        margin-top: 65px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- LOGO -->

  <div class="logo-area">
    <div class="logo">
      <span class="k">K</span><span class="rest">HOJOI</span>
    </div>
  </div>


  <!-- SEARCH -->

  <div class="search-container">

    <form class="search-box" id="searchForm">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="Search KHOJOI or type a URL"
        autocomplete="off"
        aria-label="Search Khojoi"
      >

      <div class="search-tools">

        <!-- VOICE -->

        <button
          class="tool-btn"
          type="button"
          id="voiceButton"
          title="Voice Search"
          aria-label="Voice Search">
          🎙️
        </button>

        <!-- IMAGE -->

        <button
          class="tool-btn"
          type="button"
          id="imageButton"
          title="Image Search"
          aria-label="Image Search">
          📷
        </button>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
        >

        <!-- AI -->

        <button
          class="ai-btn"
          type="button"
          id="aiButton">
          <span class="spark">✦</span>
          <span>AI Mode</span>
        </button>

      </div>

    </form>


    <!-- TABS -->

    <div class="tabs">

      <button class="tab active" data-type="web">
        All
      </button>

      <button class="tab" data-type="images">
        Images
      </button>

      <button class="tab" data-type="videos">
        Videos
      </button>

      <button class="tab" data-type="news">
        News
      </button>

      <button class="tab" data-type="ai">
        AI
      </button>

    </div>


    <!-- SHORTCUTS -->

    <div class="shortcuts">

      <div
        class="shortcut"
        data-url="https://khojoi.in">

        <div class="shortcut-icon">
          🔎
        </div>

        <div class="shortcut-name">
          KHOJOI
        </div>

      </div>


      <div
        class="shortcut"
        data-url="https://www.youtube.com">

        <div class="shortcut-icon">
          ▶️
        </div>

        <div class="shortcut-name">
          YouTube
        </div>

      </div>


      <div
        class="shortcut"
        data-url="https://github.com">

        <div class="shortcut-icon">
          ◉
        </div>

        <div class="shortcut-name">
          GitHub
        </div>

      </div>


      <div
        class="shortcut"
        data-url="https://news.google.com">

        <div class="shortcut-icon">
          📰
        </div>

        <div class="shortcut-name">
          News
        </div>

      </div>


      <div
        class="shortcut"
        id="addShortcut">

        <div class="shortcut-icon">
          +
        </div>

        <div class="shortcut-name">
          Add shortcut
        </div>

      </div>

    </div>

  </div>


  <footer>
    <a href="https://khojoi.in">Khojoi.in</a>
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
  </footer>

</div>


<script>

  const searchForm = document.getElementById("searchForm");
  const searchInput = document.getElementById("searchInput");
  const voiceButton = document.getElementById("voiceButton");
  const imageButton = document.getElementById("imageButton");
  const imageInput = document.getElementById("imageInput");
  const aiButton = document.getElementById("aiButton");
  const tabs = document.querySelectorAll(".tab");
  const shortcuts = document.querySelectorAll(".shortcut[data-url]");
  const addShortcut = document.getElementById("addShortcut");


  /* SEARCH */

  function doSearch(type = "web") {

    const query = searchInput.value.trim();

    if (!query) {
      searchInput.focus();
      return;
    }

    let url;

    if (type === "images") {

      url =
        "https://www.google.com/search?tbm=isch&q=" +
        encodeURIComponent(query);

    } else if (type === "videos") {

      url =
        "https://www.google.com/search?tbm=vid&q=" +
        encodeURIComponent(query);

    } else if (type === "news") {

      url =
        "https://www.google.com/search?tbm=nws&q=" +
        encodeURIComponent(query);

    } else {

      url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

    }

    window.location.href = url;
  }


  searchForm.addEventListener("submit", function(e) {

    e.preventDefault();

    const activeTab =
      document.querySelector(".tab.active");

    const type =
      activeTab ? activeTab.dataset.type : "web";

    doSearch(type);

  });


  /* TABS */

  tabs.forEach(tab => {

    tab.addEventListener("click", function() {

      tabs.forEach(t =>
        t.classList.remove("active")
      );

      this.classList.add("active");

      const type = this.dataset.type;

      if (type === "ai") {

        aiMode();

      } else {

        searchInput.focus();

      }

    });

  });


  /* VOICE SEARCH */

  voiceButton.addEventListener("click", function() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      alert(
        "Voice search is not supported in this browser."
      );

      return;
    }

    const recognition =
      new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    voiceButton.textContent = "🔴";

    recognition.start();

    recognition.onresult = function(event) {

      const text =
        event.results[0][0].transcript;

      searchInput.value = text;

      doSearch();

    };

    recognition.onerror = function() {

      voiceButton.textContent = "🎙️";

    };

    recognition.onend = function() {

      voiceButton.textContent = "🎙️";

    };

  });


  /* IMAGE SEARCH */

  imageButton.addEventListener("click", function() {

    imageInput.click();

  });


  imageInput.addEventListener("change", function() {

    if (this.files.length > 0) {

      alert(
        "Image selected: " +
        this.files[0].name +
        "\n\nImage search backend baad mein connect kiya ja sakta hai."
      );

    }

  });


  /* AI MODE */

  function aiMode() {

    const query =
      searchInput.value.trim();

    if (!query) {

      alert(
        "AI Mode use karne ke liye pehle apna question type karein."
      );

      searchInput.focus();

      return;

    }

    alert(
      "Khojoi AI Mode\n\n" +
      "AI search backend ko next step mein connect kiya ja sakta hai."
    );

  }


  aiButton.addEventListener(
    "click",
    aiMode
  );


  /* SHORTCUTS */

  shortcuts.forEach(shortcut => {

    shortcut.addEventListener("click", function() {

      const url = this.dataset.url;

      window.open(
        url,
        "_blank"
      );

    });

  });


  /* ADD SHORTCUT */

  addShortcut.addEventListener("click", function() {

    const name =
      prompt("Shortcut ka naam likhiye:");

    if (!name) return;

    const url =
      prompt("Website URL likhiye:");

    if (!url) return;

    window.open(
      url.startsWith("http")
        ? url
        : "https://" + url,
      "_blank"
    );

  });


  /* KEYBOARD SHORTCUT */

  document.addEventListener("keydown", function(e) {

    if (
      e.key === "/" &&
      document.activeElement !== searchInput
    ) {

      e.preventDefault();

      searchInput.focus();

    }

  });

</script>

</body>
</html>
