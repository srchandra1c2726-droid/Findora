<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KHOJIO - Search, AI & Voice</title>
<meta name="description"
content="KHOJIO - Search the web with AI and voice search.">

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#ffffff;
  --text:#202124;
  --muted:#70757a;
  --border:#dfe1e5;
  --hover:#f1f3f4;
  --panel:#ffffff;
  --blue:#1a73e8;
}

body.dark{
  --bg:#202124;
  --text:#e8eaed;
  --muted:#bdc1c6;
  --border:#5f6368;
  --hover:#303134;
  --panel:#292a2d;
  --blue:#8ab4f8;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  transition:.2s;
}

/* TOP */

.topbar{
  height:60px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
  padding:0 18px;
}

.top-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--text);
  font-size:19px;
  cursor:pointer;
}

.top-btn:hover{
  background:var(--hover);
}

/* MAIN */

.main{
  min-height:calc(100vh - 110px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:60px 15px 30px;
}

.logo{
  font-size:52px;
  font-weight:800;
  letter-spacing:-3px;
  margin-bottom:35px;
}

.logo span{
  color:var(--blue);
}

/* SEARCH */

.search-area{
  width:100%;
  max-width:700px;
}

.search-box{
  width:100%;
  min-height:58px;

  display:flex;
  align-items:center;

  padding:6px 8px 6px 18px;

  border:1px solid var(--border);
  border-radius:32px;

  background:var(--panel);

  box-shadow:0 2px 10px rgba(0,0,0,.12);

  transition:.2s;
}

.search-box:hover,
.search-box:focus-within{
  box-shadow:0 4px 18px rgba(0,0,0,.18);
}

.search-icon{
  color:var(--muted);
  font-size:25px;
  margin-right:10px;
}

.search-input{
  flex:1;
  min-width:0;

  border:0;
  outline:0;

  background:transparent;
  color:var(--text);

  font-size:16px;
}

.search-input::placeholder{
  color:var(--muted);
}

.search-btn{
  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:transparent;
  color:var(--text);

  font-size:19px;

  cursor:pointer;
}

.search-btn:hover{
  background:var(--hover);
}

.ai-btn{
  height:42px;

  padding:0 15px;

  border:0;
  border-radius:22px;

  background:transparent;
  color:var(--text);

  cursor:pointer;

  font-weight:600;
}

.ai-btn:hover{
  background:var(--hover);
}

.ai-icon{
  color:#7c4dff;
  font-size:19px;
  margin-right:5px;
}

/* TABS */

.tabs{
  display:flex;
  justify-content:center;
  gap:24px;

  margin-top:18px;

  overflow-x:auto;
}

.tabs button{
  border:0;
  background:transparent;

  color:var(--muted);

  padding:8px 2px;

  cursor:pointer;
  white-space:nowrap;
}

.tabs button:hover{
  color:var(--blue);
}

.tabs .active{
  color:var(--blue);
  border-bottom:2px solid var(--blue);
}

/* AI */

.ai-result{
  display:none;

  margin-top:18px;

  padding:20px;

  border:1px solid var(--border);
  border-radius:18px;

  background:var(--panel);

  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.ai-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;
}

.ai-title{
  color:var(--blue);
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
}

.copy-btn{
  border:0;
  padding:7px 11px;

  border-radius:8px;

  background:var(--hover);
  color:var(--text);

  cursor:pointer;
}

.ai-answer{
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
}

/* SHORTCUTS */

.shortcuts{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;

  gap:28px;

  margin-top:45px;
}

.shortcut{
  width:78px;

  text-align:center;

  color:var(--text);
  text-decoration:none;

  cursor:pointer;
}

.shortcut-icon{
  width:56px;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:auto;

  border-radius:50%;

  background:var(--hover);

  font-size:22px;
}

.shortcut-name{
  margin-top:9px;

  font-size:13px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* HISTORY */

.history{
  display:none;

  margin-top:18px;

  padding:16px;

  border:1px solid var(--border);
  border-radius:16px;

  background:var(--panel);
}

.history-title{
  font-weight:bold;
  margin-bottom:8px;
}

.history-item{
  padding:10px 2px;

  border-bottom:1px solid var(--border);

  cursor:pointer;
}

.history-item:hover{
  color:var(--blue);
}

.clear-history{
  margin-top:12px;

  padding:8px 12px;

  border:0;
  border-radius:8px;

  cursor:pointer;
}

/* MENU */

.menu{
  display:none;

  position:fixed;

  top:58px;
  right:16px;

  width:230px;

  padding:8px;

  background:var(--panel);

  border:1px solid var(--border);
  border-radius:14px;

  box-shadow:0 10px 30px rgba(0,0,0,.25);

  z-index:50;
}

.menu button{
  width:100%;

  padding:12px;

  border:0;
  border-radius:8px;

  background:transparent;

  color:var(--text);

  text-align:left;

  cursor:pointer;
}

.menu button:hover{
  background:var(--hover);
}

/* SETTINGS */

.overlay{
  display:none;

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.5);

  z-index:80;
}

.settings{
  display:none;

  position:fixed;

  z-index:90;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(440px,calc(100% - 30px));

  padding:22px;

  background:var(--panel);

  color:var(--text);

  border:1px solid var(--border);
  border-radius:20px;

  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.settings h2{
  margin-top:0;
}

.setting{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:15px;

  padding:15px 0;

  border-bottom:1px solid var(--border);
}

.setting small{
  display:block;

  margin-top:4px;

  color:var(--muted);
}

.setting select{
  padding:8px;

  border:1px solid var(--border);
  border-radius:8px;

  background:var(--panel);
  color:var(--text);
}

.done-btn{
  width:100%;

  margin-top:18px;

  padding:11px;

  border:0;
  border-radius:9px;

  background:var(--blue);
  color:white;

  cursor:pointer;
}

/* FOOTER */

.footer{
  text-align:center;

  padding:15px;

  color:var(--muted);

  font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

  .main{
    padding-top:40px;
  }

  .logo{
    font-size:42px;
    margin-bottom:28px;
  }

  .search-box{
    min-height:54px;
  }

  .camera-btn{
    display:none;
  }

  .ai-btn{
    padding:0 10px;
    font-size:12px;
  }

  .shortcuts{
    gap:18px;
    margin-top:35px;
  }

  .tabs{
    justify-content:flex-start;
  }
}
</style>
</head>

<body>

<header class="topbar">

<button class="top-btn"
        id="historyBtn"
        title="Search History">
  🕘
</button>

<button class="top-btn"
        id="settingsBtn"
        title="Settings">
  ⚙️
</button>

<button class="top-btn"
        id="moreBtn"
        title="More">
  ⋮
</button>

</header>


<main class="main">

<div class="logo">
  <span>K</span>HOJIO
</div>


<section class="search-area">

<form class="search-box" id="searchForm">

<span class="search-icon">
  ⌕
</span>

<input
  class="search-input"
  id="searchInput"
  type="search"
  placeholder="Search KHOJIO or type a URL"
  autocomplete="off"
>


<button
  type="button"
  class="search-btn"
  id="micBtn"
  title="Voice Search">
  🎙️
</button>


<button
  type="button"
  class="search-btn camera-btn"
  id="cameraBtn"
  title="Image Search">
  📷
</button>


<button
  type="button"
  class="ai-btn"
  id="aiBtn">
  <span class="ai-icon">✦</span>
  AI Mode
</button>

</form>


<!-- AI RESULT -->

<div class="ai-result" id="aiResult">

<div class="ai-header">

<div class="ai-title">
KHOJIO AI
</div>

<button class="copy-btn" id="copyBtn">
Copy
</button>

</div>

<div class="ai-answer" id="aiAnswer">
Ask anything...
</div>

</div>


<!-- SEARCH TABS -->

<div class="tabs">

<button class="active"
        onclick="webSearch()">
All
</button>

<button onclick="imageSearch()">
Images
</button>

<button onclick="videoSearch()">
Videos
</button>

<button onclick="newsSearch()">
News
</button>

<button onclick="aiBtn.click()">
AI
</button>

</div>


<!-- HISTORY -->

<div class="history" id="historyBox"></div>

</section>


<!-- SHORTCUTS -->

<div class="shortcuts" id="shortcuts">

<a class="shortcut"
   href="#"
   onclick="goSearch('KHOJIO');return false">

<div class="shortcut-icon">
🔎
</div>

<div class="shortcut-name">
KHOJIO
</div>

</a>


<a class="shortcut"
   href="https://youtube.com"
   target="_blank">

<div class="shortcut-icon">
▶
</div>

<div class="shortcut-name">
YouTube
</div>

</a>


<a class="shortcut"
   href="https://github.com"
   target="_blank">

<div class="shortcut-icon">
◉
</div>

<div class="shortcut-name">
GitHub
</div>

</a>


<a class="shortcut"
   href="https://news.google.com"
   target="_blank">

<div class="shortcut-icon">
📰
</div>

<div class="shortcut-name">
News
</div>

</a>


<a class="shortcut"
   href="#"
   onclick="addShortcut();return false">

<div class="shortcut-icon">
+
</div>

<div class="shortcut-name">
Add shortcut
</div>

</a>

</div>

</main>


<footer class="footer">
© 2026 KHOJIO · Search · AI · Voice
</footer>


<!-- MORE MENU -->

<div class="menu" id="menu">

<button onclick="openHistory()">
🕘 Search History
</button>

<button onclick="openSettings()">
⚙️ Settings
</button>

<button onclick="toggleTheme()">
🌙 Dark / Light
</button>

<button onclick="alert('KHOJIO Help')">
❓ Help
</button>

<button onclick="alert('Thanks for your feedback!')">
💬 Feedback
</button>

</div>


<!-- SETTINGS OVERLAY -->

<div class="overlay" id="overlay"></div>


<!-- SETTINGS -->

<div class="settings" id="settings">

<h2>
KHOJIO Settings
</h2>


<div class="setting">

<div>

<b>
Appearance
</b>

<small>
Light, dark or system
</small>

</div>

<select id="theme">

<option value="system">
System
</option>

<option value="light">
Light
</option>

<option value="dark">
Dark
</option>

</select>

</div>


<div class="setting">

<div>

<b>
Language
</b>

<small>
Search language
</small>

</div>

<select id="language">

<option value="en">
English
</option>

<option value="hi">
हिन्दी
</option>

<option value="hinglish">
Hinglish
</option>

</select>

</div>


<div class="setting">

<div>

<b>
AI Mode
</b>

<small>
Enable AI answers
</small>

</div>

<input
  id="aiEnabled"
  type="checkbox"
  checked
>

</div>


<div class="setting">

<div>

<b>
Voice Search
</b>

<small>
Use microphone
</small>

</div>

<input
  id="voiceEnabled"
  type="checkbox"
  checked
>

</div>


<button
  class="done-btn"
  onclick="closeSettings()">

Done

</button>

</div>


<script>

/* ELEMENTS */

const searchInput =
document.getElementById("searchInput");

const searchForm =
document.getElementById("searchForm");

const aiBtn =
document.getElementById("aiBtn");

const aiResult =
document.getElementById("aiResult");

const aiAnswer =
document.getElementById("aiAnswer");

const historyBox =
document.getElementById("historyBox");

const menu =
document.getElementById("menu");

const settings =
document.getElementById("settings");

const overlay =
document.getElementById("overlay");


/* HISTORY */

function saveHistory(text){

  let history =
    JSON.parse(
      localStorage.getItem("khojio_history") || "[]"
    );

  history =
    [
      text,
      ...history.filter(item => item !== text)
    ].slice(0,12);

  localStorage.setItem(
    "khojio_history",
    JSON.stringify(history)
  );
}


/* NORMAL SEARCH */

function webSearch(){

  const query =
    searchInput.value.trim();

  if(!query){
    searchInput.focus();
    return;
  }

  saveHistory(query);

  window.open(
    "https://www.google.com/search?q="
    + encodeURIComponent(query),
    "_blank"
  );
}


function goSearch(text){

  searchInput.value = text;

  webSearch();
}


/* IMAGE SEARCH */

function imageSearch(){

  const query =
    searchInput.value.trim();

  if(!query){
    searchInput.focus();
    return;
  }

  saveHistory(query);

  window.open(
    "https://www.google.com/search?tbm=isch&q="
    + encodeURIComponent(query),
    "_blank"
  );
}


/* VIDEO SEARCH */

function videoSearch(){

  const query =
    searchInput.value.trim();

  if(!query){
    searchInput.focus();
    return;
  }

  saveHistory(query);

  window.open(
    "https://www.google.com/search?tbm=vid&q="
    + encodeURIComponent(query),
    "_blank"
  );
}


/* NEWS */

function newsSearch(){

  const query =
    searchInput.value.trim();

  if(!query){
    searchInput.focus();
    return;
  }

  saveHistory(query);

  window.open(
    "https://news.google.com/search?q="
    + encodeURIComponent(query),
    "_blank"
  );
}


/* FORM */

searchForm.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    webSearch();

  }
);


/* AI */

aiBtn.addEventListener(
  "click",
  async function(){

    const query =
      searchInput.value.trim();

    if(!query){
      searchInput.focus();
      return;
    }

    if(
      !document.getElementById("aiEnabled").checked
    ){
      alert("AI Mode is disabled in Settings.");
      return;
    }

    saveHistory(query);

    aiResult.style.display = "block";

    aiAnswer.textContent =
      "KHOJIO AI सोच रहा है...";

    try{

      const response =
        await fetch(
          "/api/ask",
          {
            method:"POST",

            headers:{
              "Content-Type":
              "application/json"
            },

            body:JSON.stringify({
              message:query
            })
          }
        );

      const data =
        await response.json();

      if(!response.ok){
        throw new Error(
          data.error || "AI Error"
        );
      }

      aiAnswer.textContent =
        data.answer;

    }catch(error){

      console.error(error);

      aiAnswer.textContent =
        "AI अभी connected नहीं है. " +
        "Server और API key check करें.";

    }

  }
);


/* COPY AI ANSWER */

document.getElementById("copyBtn")
.addEventListener(
  "click",
  async function(){

    await navigator.clipboard.writeText(
      aiAnswer.textContent
    );

    this.textContent = "Copied";

    setTimeout(
      () => {
        this.textContent = "Copy";
      },
      1200
    );

  }
);


/* VOICE SEARCH */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  document.getElementById("micBtn")
  .addEventListener(
    "click",
    function(){

      if(
        !document
        .getElementById("voiceEnabled")
        .checked
      ){
        alert("Voice Search is disabled.");
        return;
      }

      try{

        recognition.start();

        searchInput.placeholder =
          "Listening...";

      }catch(e){}

    }
  );


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      searchInput.value = text;

      searchInput.placeholder =
        "Search KHOJIO or type a URL";

      aiBtn.click();

    };


  recognition.onend =
    function(){

      searchInput.placeholder =
        "Search KHOJIO or type a URL";

    };

}else{

  document.getElementById("micBtn")
  .addEventListener(
    "click",
    function(){

      alert(
        "Voice Search आपके browser में supported नहीं है."
      );

    }
  );

}


/* HISTORY */

function renderHistory(){

  const history =
    JSON.parse(
      localStorage.getItem("khojio_history") || "[]"
    );

  historyBox.innerHTML = "";

  const title =
    document.createElement("div");

  title.className =
    "history-title";

  title.textContent =
    "Recent searches";

  historyBox.appendChild(title);


  if(history.length === 0){

    const empty =
      document.createElement("div");

    empty.textContent =
      "No recent searches.";

    historyBox.appendChild(empty);

    return;

  }


  history.forEach(
    function(item){

      const div =
        document.createElement("div");

      div.className =
        "history-item";

      div.textContent =
        "🕘 " + item;

      div.onclick =
        function(){

          searchInput.value =
            item;

          historyBox.style.display =
            "none";

          webSearch();

        };

      historyBox.appendChild(div);

    }
  );


  const clear =
    document.createElement("button");

  clear.className =
    "clear-history";

  clear.textContent =
    "Clear history";

  clear.onclick =
    function(){

      localStorage.removeItem(
        "khojio_history"
      );

      renderHistory();

    };

  historyBox.appendChild(clear);

}


function openHistory(){

  menu.style.display =
    "none";

  historyBox.style.display =
    historyBox.style.display === "block"
      ? "none"
      : "block";

  renderHistory();

}


document.getElementById("historyBtn")
.addEventListener(
  "click",
  openHistory
);


/* MORE MENU */

document.getElementById("moreBtn")
.addEventListener(
  "click",
  function(e){

    e.stopPropagation();

    menu.style.display =
      menu.style.display === "block"
        ? "none"
        : "block";

  }
);


document.addEventListener(
  "click",
  function(e){

    if(
      e.target.id !== "moreBtn" &&
      !menu.contains(e.target)
    ){

      menu.style.display =
        "none";

    }

  }
);


/* SETTINGS */

function openSettings(){

  menu.style.display =
    "none";

  settings.style.display =
    "block";

  overlay.style.display =
    "block";

}


function closeSettings(){

  settings.style.display =
    "none";

  overlay.style.display =
    "none";

}


document.getElementById("settingsBtn")
.addEventListener(
  "click",
  openSettings
);


overlay.addEventListener(
  "click",
  closeSettings
);


/* THEME */

function applyTheme(theme){

  let dark = false;

  if(theme === "dark"){

    dark = true;

  }else if(theme === "system"){

    dark =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

  }

  document.body.classList.toggle(
    "dark",
    dark
  );

  localStorage.setItem(
    "khojio_theme",
    theme
  );

}


function toggleTheme(){

  const dark =
    document.body.classList.contains("dark");

  applyTheme(
    dark ? "light" : "dark"
  );

}


document.getElementById("theme")
.addEventListener(
  "change",
  function(){

    applyTheme(
      this.value
    );

  }
);


const savedTheme =
  localStorage.getItem(
    "khojio_theme"
  ) || "system";

document.getElementById("theme")
.value = savedTheme;

applyTheme(savedTheme);


/* LANGUAGE */

document.getElementById("language")
.addEventListener(
  "change",
  function(){

    localStorage.setItem(
      "khojio_language",
      this.value
    );

    if(this.value === "hi"){

      searchInput.placeholder =
        "KHOJIO पर खोजें...";

    }else{

      searchInput.placeholder =
        "Search KHOJIO or type a URL";

    }

  }
);


/* ADD SHORTCUT */

function addShortcut(){

  const name =
    prompt("Shortcut name?");

  const url =
    prompt("Website URL?");

  if(!name || !url){
    return;
  }

  const link =
    document.createElement("a");

  link.className =
    "shortcut";

  link.href =
    url.startsWith("http")
      ? url
      : "https://" + url;

  link.target =
    "_blank";

  link.innerHTML =
    `
      <div class="shortcut-icon">
        +
      </div>

      <div class="shortcut-name">
        ${name}
      </div>
    `;

  document
    .getElementById("shortcuts")
    .insertBefore(
      link,
      document
        .getElementById("shortcuts")
        .lastElementChild
    );

}


/* CAMERA */

document.getElementById("cameraBtn")
.addEventListener(
  "click",
  imageSearch
);

</script>

</body>
</html>
