<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KHOJIO - Search & AI</title>

<meta name="description"
content="KHOJIO - Search the web with AI and voice search.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
}

/* ================= PAGE ================= */

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ================= TOP ================= */

.top{
  width:100%;
  height:55px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:0 25px;
}

.top a{
  color:#333;
  text-decoration:none;
  font-size:14px;
  margin-left:20px;
}

.top a:hover{
  text-decoration:underline;
}

/* ================= MAIN ================= */

.main{
  width:100%;
  max-width:900px;

  display:flex;
  flex-direction:column;
  align-items:center;

  margin-top:75px;
}

/* ================= LOGO ================= */

.logo{
  width:230px;
  max-width:55%;
  height:auto;
  object-fit:contain;

  margin-bottom:40px;
}

/*
 Agar logo image nahi hai to text logo dikhega
*/

.logo-text{
  display:none;

  font-size:64px;
  font-weight:700;
  letter-spacing:-4px;

  margin-bottom:38px;

  background:linear-gradient(
    90deg,
    #1769e0,
    #18a957,
    #f6b400
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ================= SEARCH ================= */

.search-area{
  width:100%;
  max-width:620px;
  position:relative;
}

.search-box{
  width:100%;
  height:58px;

  display:flex;
  align-items:center;

  border:1px solid #dfe1e5;
  border-radius:30px;

  padding:0 9px 0 17px;

  background:#fff;

  box-shadow:
    0 2px 7px rgba(60,64,67,.15);

  transition:.2s;
}

.search-box:hover,
.search-box:focus-within{
  box-shadow:
    0 2px 10px rgba(60,64,67,.22);
}

/* SEARCH ICON */

.search-icon{
  width:25px;
  min-width:25px;
  height:25px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#5f6368;
  font-size:25px;

  margin-right:10px;
}

/* INPUT */

.search-input{
  flex:1;

  min-width:0;

  border:0;
  outline:0;

  font-size:17px;

  color:#202124;
  background:transparent;
}

.search-input::placeholder{
  color:#70757a;
}

/* ================= ICON BUTTONS ================= */

.icon-btn{
  width:42px;
  height:42px;

  border:0;
  background:transparent;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  color:#202124;

  font-size:20px;

  transition:.15s;
}

.icon-btn:hover{
  background:#f1f3f4;
}

.mic-icon{
  font-size:21px;
}

.camera-icon{
  font-size:21px;
}

/* ================= AI BUTTON ================= */

.ai-btn{
  height:42px;

  border:0;
  border-radius:23px;

  padding:0 17px;

  background:#f1f3f4;

  color:#202124;

  font-size:15px;

  display:flex;
  align-items:center;
  gap:6px;

  cursor:pointer;

  white-space:nowrap;

  margin-left:3px;
}

.ai-btn:hover{
  background:#e8eaed;
}

.ai-star{
  font-size:19px;
}

/* ================= SHORTCUTS ================= */

.shortcuts{
  width:100%;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  gap:28px;

  margin-top:48px;

  flex-wrap:wrap;
}

.shortcut{
  width:85px;

  text-align:center;

  cursor:pointer;

  text-decoration:none;

  color:#202124;
}

.shortcut-icon{
  width:58px;
  height:58px;

  margin:0 auto 12px;

  border-radius:50%;

  background:#f1f3f4;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;

  transition:.15s;
}

.shortcut:hover .shortcut-icon{
  background:#e5e7e9;
  transform:translateY(-2px);
}

.shortcut-name{
  font-size:14px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ================= ADD SHORTCUT ================= */

.add-icon{
  font-size:30px;
  font-weight:300;
}

/* ================= AI RESULT ================= */

.ai-result{
  display:none;

  width:100%;
  max-width:620px;

  margin-top:18px;

  padding:18px 20px;

  border:1px solid #e1e4e8;

  border-radius:18px;

  background:#fff;

  box-shadow:
    0 3px 15px rgba(0,0,0,.08);

  text-align:left;
}

.ai-title{
  font-size:12px;

  font-weight:bold;

  color:#1967d2;

  letter-spacing:1px;

  margin-bottom:10px;
}

#aiAnswer{
  font-size:15px;
  line-height:1.6;

  white-space:pre-wrap;

  color:#303134;
}

/* ================= FOOTER ================= */

.footer{
  margin-top:auto;

  width:100%;

  text-align:center;

  padding:20px;

  color:#70757a;

  font-size:12px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .top{
    padding:0 15px;
  }

  .main{
    margin-top:55px;
    padding:0 15px;
  }

  .logo{
    width:190px;
    margin-bottom:30px;
  }

  .search-box{
    height:54px;
  }

  .search-input{
    font-size:15px;
  }

  .camera-icon{
    display:none;
  }

  .ai-btn{
    padding:0 12px;
    font-size:13px;
  }

  .shortcuts{
    gap:18px;
    margin-top:35px;
  }

}

@media(max-width:430px){

  .main{
    margin-top:40px;
  }

  .logo{
    width:170px;
  }

  .search-box{
    padding-left:13px;
  }

  .icon-btn{
    width:37px;
    height:37px;
  }

  .ai-btn{
    height:38px;
    padding:0 10px;
  }

  .shortcuts{
    gap:12px;
  }

  .shortcut{
    width:72px;
  }

  .shortcut-icon{
    width:52px;
    height:52px;
  }

}
</style>
</head>


<body>

<div class="page">

  <!-- TOP -->

  <div class="top">
    <a href="#">About</a>
    <a href="#">AI</a>
  </div>


  <!-- MAIN -->

  <main class="main">

    <!-- KHOJIO LOGO -->

    <img
      src="logo.png"
      alt="KHOJIO"
      class="logo"
      onerror="
        this.style.display='none';
        document.querySelector('.logo-text').style.display='block';
      "
    >

    <div class="logo-text">
      KHOJIO
    </div>


    <!-- SEARCH -->

    <div class="search-area">

      <form
        class="search-box"
        id="searchForm"
      >

        <span class="search-icon">
          ⌕
        </span>


        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search KHOJIO or type a URL"
          autocomplete="off"
          aria-label="Search"
        >


        <!-- MIC -->

        <button
          type="button"
          class="icon-btn"
          id="micBtn"
          title="Voice Search"
          aria-label="Voice Search"
        >
          <span class="mic-icon">🎙</span>
        </button>


        <!-- CAMERA -->

        <button
          type="button"
          class="icon-btn"
          id="cameraBtn"
          title="Image Search"
          aria-label="Image Search"
        >
          <span class="camera-icon">▣</span>
        </button>


        <!-- AI -->

        <button
          type="button"
          class="ai-btn"
          id="aiBtn"
        >
          <span class="ai-star">✦</span>
          AI Mode
        </button>

      </form>


      <!-- AI RESULT -->

      <div
        class="ai-result"
        id="aiResult"
      >

        <div class="ai-title">
          KHOJIO AI
        </div>

        <div id="aiAnswer">
          Ask anything...
        </div>

      </div>

    </div>


    <!-- SHORTCUTS -->

    <div class="shortcuts">

      <a
        class="shortcut"
        href="#"
        onclick="searchShortcut('KHOJIO')"
      >

        <div class="shortcut-icon">
          🔎
        </div>

        <div class="shortcut-name">
          KHOJIO
        </div>

      </a>


      <a
        class="shortcut"
        href="#"
        onclick="webSearch('GitHub')"
      >

        <div class="shortcut-icon">
          ◉
        </div>

        <div class="shortcut-name">
          GitHub
        </div>

      </a>


      <a
        class="shortcut"
        href="#"
        onclick="webSearch('YouTube')"
      >

        <div class="shortcut-icon">
          ▶
        </div>

        <div class="shortcut-name">
          YouTube
        </div>

      </a>


      <a
        class="shortcut"
        href="#"
        onclick="webSearch('Google')"
      >

        <div class="shortcut-icon">
          G
        </div>

        <div class="shortcut-name">
          Google
        </div>

      </a>


      <a
        class="shortcut"
        href="#"
        onclick="webSearch('News')"
      >

        <div class="shortcut-icon">
          📰
        </div>

        <div class="shortcut-name">
          News
        </div>

      </a>


      <a
        class="shortcut"
        href="#"
        onclick="addShortcut()"
      >

        <div class="shortcut-icon add-icon">
          +
        </div>

        <div class="shortcut-name">
          Add shortcut
        </div>

      </a>

    </div>

  </main>


  <footer class="footer">
    © 2026 KHOJIO · Search · AI · Voice
  </footer>

</div>


<script>

/* ================= ELEMENTS ================= */

const input =
  document.getElementById("searchInput");

const searchForm =
  document.getElementById("searchForm");

const micBtn =
  document.getElementById("micBtn");

const aiBtn =
  document.getElementById("aiBtn");

const aiResult =
  document.getElementById("aiResult");

const aiAnswer =
  document.getElementById("aiAnswer");


/* ================= NORMAL SEARCH ================= */

searchForm.addEventListener("submit", function(e){

  e.preventDefault();

  const query =
    input.value.trim();

  if(!query) return;

  webSearch(query);

});


function webSearch(query){

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(query),
    "_blank"
  );

}


function searchShortcut(query){

  input.value = query;

  webSearch(query);

}


/* ================= AI ================= */

aiBtn.addEventListener("click", async function(){

  const query =
    input.value.trim();

  if(!query){

    input.focus();

    aiAnswer.textContent =
      "Type your question first.";

    aiResult.style.display = "block";

    return;
  }


  aiResult.style.display = "block";

  aiAnswer.textContent =
    "KHOJIO AI is thinking...";


  try{

    const response =
      await fetch("/api/ask",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:query
        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error || "AI error"
      );

    }


    aiAnswer.textContent =
      data.answer;


  }catch(error){

    aiAnswer.textContent =
      "AI is not connected yet. Please check your server/API configuration.";

    console.error(error);

  }

});


/* ================= VOICE ================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  const recognition =
    new SpeechRecognition();


  recognition.lang = "en-IN";

  recognition.continuous = false;

  recognition.interimResults = false;


  micBtn.addEventListener("click", function(){

    try{

      recognition.start();

      micBtn.style.background =
        "#e8f0fe";

      input.placeholder =
        "Listening...";

    }catch(error){

      console.log(error);

    }

  });


  recognition.onresult =
  function(event){

    const text =
      event.results[0][0].transcript;


    input.value = text;

    input.placeholder =
      "Search KHOJIO or type a URL";


    /*
      Voice ke baad AI answer
    */

    aiBtn.click();

  };


  recognition.onend =
  function(){

    micBtn.style.background =
      "transparent";

    input.placeholder =
      "Search KHOJIO or type a URL";

  };


  recognition.onerror =
  function(){

    micBtn.style.background =
      "transparent";

    input.placeholder =
      "Microphone permission required";

    setTimeout(function(){

      input.placeholder =
        "Search KHOJIO or type a URL";

    },2000);

  };

}


/* ================= CAMERA ================= */

document
.getElementById("cameraBtn")
.addEventListener("click",function(){

  alert(
    "Image Search feature can be connected here."
  );

});


/* ================= ADD SHORTCUT ================= */

function addShortcut(){

  const name =
    prompt("Shortcut name:");

  const url =
    prompt("Website URL:");

  if(!name || !url) return;

  const link =
    document.createElement("a");

  link.className =
    "shortcut";

  link.href =
    url.startsWith("http")
      ? url
      : "https://" + url;

  link.target="_blank";

  link.innerHTML = `
    <div class="shortcut-icon">
      +
    </div>
    <div class="shortcut-name">
      ${name}
    </div>
  `;

  document
    .querySelector(".shortcuts")
    .insertBefore(
      link,
      document.querySelector(".shortcuts").lastElementChild
    );

}

</script>
<img src="logo.png" alt="Khojio Logo" width="150">
    <script async src="https://cse.google.com/cse.js?cx=93d75dd86436c4d96">
</script>
<div class="gcse-search"></div>
  </body>
  </html>
