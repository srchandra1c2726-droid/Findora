<style>

*{

padding:0;

body{

/* HEADER */

header{

height:75px;
display:flex;
align-items:center;

.logo{

height:45px;

/* MAIN */


main{

margin:auto;

padding:70px 20px;

text-align:center;

}



.hero-logo{

width:100px;
height:100px;

align-items:center;
justify-content:center;

font-size:45px;

/* SEARCH */


.search-box{

margin:40px auto;

max-width:800px;

height:70px;

display:flex;

align-items:center;

padding:10px;

border-radius:40px;

background:#ffffff12;

border:1px solid #ffffff30;

backdrop-filter:blur(20px);

}



.search-box input{

flex:1;

height:100%;

background:none;

border:none;

outline:none;

color:white;

font-size:18px;

padding:0 15px;

}



.btn{

width:50px;

height:50px;

border:none;

border-radius:50%;

background:#ffffff15;

color:white;

font-size:20px;

cursor:pointer;

margin-left:8px;

transition:.3s;

}



.btn:hover{

transform:scale(1.1);

background:#2563eb;

}



.ai-btn{

background:
linear-gradient(135deg,#2563eb,#9333ea);

}



/* CARDS */


.cards{

margin-top:60px;

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

}


.card{

padding:25px;

border-radius:25px;

background:#ffffff10;

border:1px solid #ffffff20;

backdrop-filter:blur(15px);

}



.card:hover{

transform:translateY(-8px);

transition:.3s;

box-shadow:0 20px 40px #0008;

}



.icon{

font-size:35px;

margin-bottom:15px;

}



@media(max-width:700px){

.cards{

grid-template-columns:1fr;

}


h1{

font-size:32px;

}

}

<div class="search-box">


<span>

<h3>

<p>
Smart aur fast search.

🎤

<p>
Bolkar search kare.

  <script>


// ELEMENTS

const input = document.getElementById("searchInput");

const searchBtn = document.getElementById("searchBtn");

const micBtn = document.getElementById("micBtn");

const aiBtn = document.getElementById("aiBtn");

const imageInput = document.getElementById("imageInput");




// SEARCH HISTORY

function saveHistory(text){

let data =
JSON.parse(
localStorage.getItem("khojio_history")
) || [];


data.unshift({

text:text,

time:new Date().toLocaleString()

});


data=data.slice(0,50);


localStorage.setItem(
"khojio_history",
JSON.stringify(data)
);


}




// SEARCH FUNCTION

searchBtn.onclick=function(){

let text=input.value.trim();


if(text===""){

alert("Kuch search kare");

return;

}


saveHistory(text);


window.open(
"https://www.google.com/search?q="
+
encodeURIComponent(text),
"_blank"
);


};



input.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

searchBtn.click();

}

});






// VOICE SEARCH


const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(SpeechRecognition){


const recognition =
new SpeechRecognition();


recognition.lang="hi-IN";


recognition.continuous=false;



micBtn.onclick=function(){

micBtn.innerHTML="🔴";

recognition.start();

};



recognition.onresult=function(event){


let voiceText =
event.results[0][0].transcript;


input.value=voiceText;


micBtn.innerHTML="🎤";


};



recognition.onend=function(){

micBtn.innerHTML="🎤";

};



}
else{


micBtn.onclick=function(){

alert(
"Browser voice support nahi karta"
);

};


}







// IMAGE PREVIEW


imageInput.onchange=function(){


let file=this.files[0];


if(!file){

return;

}



let imgURL =
URL.createObjectURL(file);



let box =
document.createElement("div");


box.style.position="fixed";
box.style.top="50%";
box.style.left="50%";
box.style.transform="translate(-50%,-50%)";
box.style.background="#111827";
box.style.padding="20px";
box.style.borderRadius="20px";
box.style.zIndex="999";


box.innerHTML=`

<img src="${imgURL}" 
style="max-width:300px;border-radius:15px">

<br><br>

<button onclick="this.parentElement.remove()"
style="padding:10px;border-radius:10px">

Close

</button>

`;


document.body.appendChild(box);



};





// AI BUTTON DEMO


aiBtn.onclick=function(){


let text=input.value.trim();



if(!text){

alert(
"AI ke liye kuch likho"
);

return;

}



alert(

"KHOJIO AI Processing:\n\n"
+
text

);



};



</script>
  <script>


// DARK MODE

function toggleDark(){

document.body.classList.toggle("light");

"khojio_theme",

);

localStorage.getItem("khojio_theme")
){

// SHOW HISTORY

function showHistory(){


let data =
JSON.parse(
localStorage.getItem("khojio_history")
) || [];



if(data.length===0){

alert("History empty hai");

return;

}



let text="Khojio History:\n\n";


data.forEach((item,index)=>{

text +=
(index+1)+
". "+
item.text+
"\n"+
item.time+
"\n\n";

});


alert(text);


}





// CLEAR HISTORY


function clearHistory(){

localStorage.removeItem(
"khojio_history"
);


alert(
"History clear ho gayi"
);


}





// DOWNLOAD HISTORY


function saveDownload(name){


let data =
JSON.parse(
localStorage.getItem("khojio_download")
) || [];



data.unshift({

file:name,

time:new Date().toLocaleString()

});



localStorage.setItem(
"khojio_download",
JSON.stringify(data)
);


}





// SECURITY URL SCAN


function scanURL(url){

alert(
"URL dalo"
);

return;

}



if(
url.startsWith("https://")
){

alert(
"✅ URL Safe lag raha hai"
);

}

else{

alert(
"⚠️ HTTP URL hai, savdhan rahe"
);

}



}
